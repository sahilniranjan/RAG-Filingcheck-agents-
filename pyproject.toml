[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filingcheck"
version = "0.1.0"
description = "Evidence-checking assistant over SEC 10-K filings (Items 1A, 1C, 7) with cited answers or needs-review routing."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "tiktoken==0.14.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "openai>=1.40",
    "anthropic>=2.0",
    "sentence-transformers>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
