# Local Postgres 16 with pgvector for FilingCheck.
# sql/schema.sql runs automatically the first time the volume is created.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: filingcheck-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filingcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filingcheck}
      POSTGRES_DB: ${POSTGRES_DB:-filingcheck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
